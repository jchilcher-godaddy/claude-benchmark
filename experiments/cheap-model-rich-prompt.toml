name = "cheap-model-rich-prompt"
description = """Hypothesis: Haiku with the full Python optimal stack (code-reviewer persona + polite \
framing) matches or exceeds bare Opus on composite score at ~10x lower cost, because prompting gains \
compound more on weaker models ("Haiku is the canary"). Directly maps the Pareto frontier between \
model tier and prompt richness. Distinct from model-selection (which tested each model bare) and \
persona/politeness (which averaged across models)."""

[defaults]
tasks = [
    "code-gen-01", "code-gen-02", "code-gen-03",
    "bug-fix-01", "bug-fix-02", "bug-fix-03",
    "refactor-01", "refactor-02", "refactor-03",
    "instruction-01", "instruction-02", "instruction-03",
]
profiles = ["empty"]
reps = 30

# --- Haiku bare ---
[[variants]]
label = "haiku-bare"
models = ["haiku"]

# --- Haiku with optimal stack ---
[[variants]]
label = "haiku-rich"
models = ["haiku"]
prompt_prefix = "Could you please "
system_prompt_extra = "You are a meticulous code reviewer. Focus on correctness, edge cases, and maintainability in every line you write."

# --- Sonnet bare ---
[[variants]]
label = "sonnet-bare"
models = ["sonnet"]

# --- Sonnet with optimal stack ---
[[variants]]
label = "sonnet-rich"
models = ["sonnet"]
prompt_prefix = "Could you please "
system_prompt_extra = "You are a meticulous code reviewer. Focus on correctness, edge cases, and maintainability in every line you write."

# --- Opus bare ---
[[variants]]
label = "opus-bare"
models = ["opus"]
