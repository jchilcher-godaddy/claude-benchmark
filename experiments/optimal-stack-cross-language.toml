name = "optimal-stack-cross-language"
description = """Hypothesis: The inferred per-language optimal stacks (Python: persona + polite + no CoT; \
Go/C#: CoT + no persona + no polite) outperform bare baselines when tested as combined configurations. \
Currently these stacks are recommended based on combining single-factor findings — persona helps Python \
but hurts Go, CoT hurts Python but helps Go/C#, politeness helps JS but hurts Go/C#. But interaction \
effects have never been validated: CoT + persona together might cancel out, or CoT + no-persona might \
be worse than either alone. This experiment tests each language's inferred optimal stack as a unit. \
JS included with its own stack (persona + polite + no CoT) to validate. \
Instruction tasks excluded (Python-specific constructs). \
Total: 10 reps x 48 tasks x 3 models x 3 variants = 4,320 runs."""

[defaults]
tasks = [
    # Python
    "code-gen-01", "code-gen-02", "code-gen-03", "code-gen-04", "code-gen-05",
    "bug-fix-01", "bug-fix-02", "bug-fix-03", "bug-fix-04",
    "refactor-01", "refactor-02", "refactor-03",
    # Go
    "code-gen-01-go", "code-gen-02-go", "code-gen-03-go", "code-gen-04-go", "code-gen-05-go",
    "bug-fix-01-go", "bug-fix-02-go", "bug-fix-03-go", "bug-fix-04-go",
    "refactor-01-go", "refactor-02-go", "refactor-03-go",
    # JavaScript
    "code-gen-01-js", "code-gen-02-js", "code-gen-03-js", "code-gen-04-js", "code-gen-05-js",
    "bug-fix-01-js", "bug-fix-02-js", "bug-fix-03-js", "bug-fix-04-js",
    "refactor-01-js", "refactor-02-js", "refactor-03-js",
    # C#
    "code-gen-01-cs", "code-gen-02-cs", "code-gen-03-cs", "code-gen-04-cs", "code-gen-05-cs",
    "bug-fix-01-cs", "bug-fix-02-cs", "bug-fix-03-cs", "bug-fix-04-cs",
    "refactor-01-cs", "refactor-02-cs", "refactor-03-cs",
]
models = ["haiku", "sonnet", "opus"]
profiles = ["empty"]
reps = 10

# --- Bare baseline (no modifications) ---
# Cross-language bare; post-run compare against existing cross-language baseline.
[[variants]]
label = "bare"

# --- Python/JS optimal stack ---
# Code-reviewer persona + polite framing + no CoT + default temp.
# Expected to help Python and JS, may hurt Go and C#.
[[variants]]
label = "python-js-stack"
prompt_prefix = "Could you please "
system_prompt_extra = "You are a meticulous code reviewer. Focus on correctness, edge cases, and maintainability in every line you write."

# --- Go/C# optimal stack ---
# CoT prefix + no persona + no polite framing + default temp.
# Expected to help Go and C#, may hurt Python.
[[variants]]
label = "go-cs-stack"
prompt_prefix = "Think step by step. "
