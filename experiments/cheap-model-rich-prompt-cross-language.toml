name = "cheap-model-rich-prompt-cross-language"
description = """\
Hypothesis: Haiku + code-reviewer persona matching or exceeding bare Opus (cheap-model-rich-prompt, \
1,800 Python-only runs) generalizes cross-language. The persona effect is known to be \
language-dependent (cross-language experiment: "persona is language-dependent"), and Haiku's \
baseline drops sharply outside Python (cross-language: up to 29-point model spread). This \
experiment tests whether prompt enrichment still closes the model gap across Go, JS, and C#, \
or whether the cost savings claim only holds for Python. \
Backs: presentation slide 8 and slide 11 cheat sheet row 7. \
Total: 5 variants × 48 tasks × 15 reps = 3,600 runs (~$250)."""

[defaults]
tasks = [
    # Python
    "code-gen-01", "code-gen-02", "code-gen-03", "code-gen-04", "code-gen-05",
    "bug-fix-01", "bug-fix-02", "bug-fix-03", "bug-fix-04",
    "refactor-01", "refactor-02", "refactor-03",
    # Go
    "code-gen-01-go", "code-gen-02-go", "code-gen-03-go", "code-gen-04-go", "code-gen-05-go",
    "bug-fix-01-go", "bug-fix-02-go", "bug-fix-03-go", "bug-fix-04-go",
    "refactor-01-go", "refactor-02-go", "refactor-03-go",
    # JavaScript
    "code-gen-01-js", "code-gen-02-js", "code-gen-03-js", "code-gen-04-js", "code-gen-05-js",
    "bug-fix-01-js", "bug-fix-02-js", "bug-fix-03-js", "bug-fix-04-js",
    "refactor-01-js", "refactor-02-js", "refactor-03-js",
    # C#
    "code-gen-01-cs", "code-gen-02-cs", "code-gen-03-cs", "code-gen-04-cs", "code-gen-05-cs",
    "bug-fix-01-cs", "bug-fix-02-cs", "bug-fix-03-cs", "bug-fix-04-cs",
    "refactor-01-cs", "refactor-02-cs", "refactor-03-cs",
]
profiles = ["empty"]
reps = 15

# --- Haiku bare ---
[[variants]]
label = "haiku-bare"
models = ["haiku"]

# --- Haiku with optimal stack (persona + polite) ---
[[variants]]
label = "haiku-rich"
models = ["haiku"]
prompt_prefix = "Could you please "
system_prompt_extra = "You are a meticulous code reviewer. Focus on correctness, edge cases, and maintainability in every line you write."

# --- Sonnet bare ---
[[variants]]
label = "sonnet-bare"
models = ["sonnet"]

# --- Sonnet with optimal stack ---
[[variants]]
label = "sonnet-rich"
models = ["sonnet"]
prompt_prefix = "Could you please "
system_prompt_extra = "You are a meticulous code reviewer. Focus on correctness, edge cases, and maintainability in every line you write."

# --- Opus bare ---
[[variants]]
label = "opus-bare"
models = ["opus"]
