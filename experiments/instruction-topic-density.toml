name = "instruction-topic-density"
description = """Hypothesis: CLAUDE.md focused on a single relevant topic outperforms multi-topic \
instructions at the same token count. With 60+ tool definitions and 11 architecture layers already in \
the system prompt (per Claude Code source leak), multi-topic instructions may scatter attention across \
competing concerns. Single-topic focus concentrates the model's attention more effectively. Tests \
focus vs. breadth at constant ~30 tokens, plus breadth at expanded ~100 tokens."""

[defaults]
tasks = [
    # Python
    "code-gen-01", "code-gen-02", "code-gen-03", "code-gen-04", "code-gen-05",
    "bug-fix-01", "bug-fix-02", "bug-fix-03", "bug-fix-04",
    "refactor-01", "refactor-02", "refactor-03",
    # Go
    "code-gen-01-go", "code-gen-02-go", "code-gen-03-go", "code-gen-04-go", "code-gen-05-go",
    "bug-fix-01-go", "bug-fix-02-go", "bug-fix-03-go", "bug-fix-04-go",
    "refactor-01-go", "refactor-02-go", "refactor-03-go",
    # JavaScript
    "code-gen-01-js", "code-gen-02-js", "code-gen-03-js", "code-gen-04-js", "code-gen-05-js",
    "bug-fix-01-js", "bug-fix-02-js", "bug-fix-03-js", "bug-fix-04-js",
    "refactor-01-js", "refactor-02-js", "refactor-03-js",
    # C#
    "code-gen-01-cs", "code-gen-02-cs", "code-gen-03-cs", "code-gen-04-cs", "code-gen-05-cs",
    "bug-fix-01-cs", "bug-fix-02-cs", "bug-fix-03-cs", "bug-fix-04-cs",
    "refactor-01-cs", "refactor-02-cs", "refactor-03-cs",
]
models = ["haiku", "sonnet", "opus"]
profiles = ["empty"]
reps = 15

# --- Bare baseline ---
[[variants]]
label = "bare"

# --- Single focus: code correctness (~30 tokens) ---
[[variants]]
label = "focus-correctness"
system_prompt_extra = "Focus exclusively on correctness. Handle every edge case. Validate all inputs. Test boundary conditions mentally before finalizing. Every code path must be intentional."

# --- Single focus: code structure (~30 tokens) ---
[[variants]]
label = "focus-structure"
system_prompt_extra = "Focus exclusively on clean structure. Keep functions under 20 lines. Single responsibility per function. Prefer composition over inheritance. Extract complex logic into well-named helpers."

# --- Single focus: readability (~30 tokens) ---
[[variants]]
label = "focus-readability"
system_prompt_extra = "Focus exclusively on readability. Use descriptive variable names. Write self-documenting code. Prefer clarity over cleverness. Every name should reveal intent without needing a comment."

# --- Multi-topic at ~30 tokens (same budget, spread across 3 topics) ---
[[variants]]
label = "multi-topic-30"
system_prompt_extra = "Handle edge cases. Keep functions short. Use clear names. Validate inputs. Prefer composition. Write readable code."

# --- Multi-topic at ~60 tokens (moderate expansion across topics) ---
[[variants]]
label = "multi-topic-60"
system_prompt_extra = "Handle all edge cases and validate inputs at boundaries. Keep functions focused and under 20 lines. Use descriptive names that reveal intent. Prefer composition over inheritance. Write self-documenting, readable code."

# --- Multi-topic at ~100 tokens (5 topics with detail) ---
[[variants]]
label = "multi-topic-100"
system_prompt_extra = """Handle all edge cases and validate inputs at function boundaries. Use specific exception types with descriptive messages.
Keep functions focused on a single responsibility, under 20 lines. Prefer composition over inheritance.
Use descriptive variable names that reveal intent. Write self-documenting code that needs no comments.
Use type hints on all parameters and return types. Prefer early returns to reduce nesting.
Write code that is easy to test. Keep side effects at the edges. Return values rather than mutating state."""
