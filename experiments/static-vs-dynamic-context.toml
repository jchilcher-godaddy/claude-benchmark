name = "static-vs-dynamic-context"
description = """Hypothesis: Task-relevant context injected per-turn outperforms static boilerplate \
instructions, even at the same token count. Inspired by the Claude Code source leak revealing that \
UserPromptSubmit hooks can inject dynamic additionalContext per message. Our r=-0.95 finding between \
token count and quality may be specific to static/generic instructions. Context that is directly \
relevant to the current task type might have a positive or neutral token/quality correlation, inverting \
the 'less is more' effect. Tests static-generic vs. static-task-typed vs. task-specific context \
across all 4 languages."""

[defaults]
tasks = [
    # Python
    "code-gen-01", "code-gen-02", "code-gen-03", "code-gen-04", "code-gen-05",
    "bug-fix-01", "bug-fix-02", "bug-fix-03", "bug-fix-04",
    "refactor-01", "refactor-02", "refactor-03",
    # Go
    "code-gen-01-go", "code-gen-02-go", "code-gen-03-go", "code-gen-04-go", "code-gen-05-go",
    "bug-fix-01-go", "bug-fix-02-go", "bug-fix-03-go", "bug-fix-04-go",
    "refactor-01-go", "refactor-02-go", "refactor-03-go",
    # JavaScript
    "code-gen-01-js", "code-gen-02-js", "code-gen-03-js", "code-gen-04-js", "code-gen-05-js",
    "bug-fix-01-js", "bug-fix-02-js", "bug-fix-03-js", "bug-fix-04-js",
    "refactor-01-js", "refactor-02-js", "refactor-03-js",
    # C#
    "code-gen-01-cs", "code-gen-02-cs", "code-gen-03-cs", "code-gen-04-cs", "code-gen-05-cs",
    "bug-fix-01-cs", "bug-fix-02-cs", "bug-fix-03-cs", "bug-fix-04-cs",
    "refactor-01-cs", "refactor-02-cs", "refactor-03-cs",
]
models = ["haiku", "sonnet", "opus"]
profiles = ["empty"]
reps = 15

# --- Bare baseline (no extra context) ---
[[variants]]
label = "bare"

# --- Static generic: ~50 tokens of boilerplate coding guidelines ---
[[variants]]
label = "static-generic"
prompt_prefix = "Validate all inputs at function boundaries. Handle edge cases explicitly. Write clean, well-structured code. Keep functions focused on a single responsibility. Use the language's idiomatic error handling. "

# --- Static task-type-relevant: bug-fix specific guidance (applied to ALL tasks) ---
# This tests whether task-type-specific guidance helps even when mismatched to some tasks
[[variants]]
label = "static-bugfix-guidance"
prompt_prefix = "Trace the root cause before applying a fix. Verify the fix handles the original failing case. Check that the fix doesn't break adjacent functionality. Test boundary conditions. Preserve existing behavior for valid inputs. "

# --- Static task-type-relevant: code-gen specific guidance (applied to ALL tasks) ---
[[variants]]
label = "static-codegen-guidance"
prompt_prefix = "Design the function signature and return type first. Handle all edge cases including empty input, null/nil/None, and boundary values. Write the implementation to be easily testable. Use clear variable names that reveal intent. "

# --- Static task-type-relevant: refactor specific guidance (applied to ALL tasks) ---
[[variants]]
label = "static-refactor-guidance"
prompt_prefix = "Preserve all existing behavior exactly. Simplify complex conditionals. Extract repeated logic into well-named helpers. Reduce cyclomatic complexity. Improve naming without changing the public API. "

# --- Matched task-type guidance: adaptive per-task-type ---
# Note: This uses prompt_prefix which applies uniformly. As a proxy, we use guidance
# that is broadly relevant across task types, encouraging the model to identify the task type.
[[variants]]
label = "adaptive-general"
prompt_prefix = "Consider what type of task this is. For new code: design the signature first, handle all edge cases. For bug fixes: trace the root cause before fixing. For refactoring: preserve existing behavior exactly. Then implement. "
