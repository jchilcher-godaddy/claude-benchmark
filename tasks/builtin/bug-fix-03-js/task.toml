name = "bug-fix-03-js"
task_type = "bug-fix"
difficulty = "hard"
size = "module"
language = "javascript"
description = "Fix race conditions in async counter implementation"
starter_code = "starter.js"
expected_files = ["solution.js"]

prompt = """
The file `starter.js` contains an `AsyncCounter` class intended for async use. It has concurrency bugs that cause incorrect counts under concurrent access.

Fix the async race condition issues. The class should have:
- `async increment()` -- atomically increase the counter by 1
- `async decrement()` -- atomically decrease the counter by 1
- `get()` -- return the current value
- `reset()` -- reset the counter to 0
- `async incrementBy(n)` -- atomically increase the counter by n

All async operations must be properly serialized to avoid race conditions.

Save your corrected solution as `solution.js`.
"""

tags = ["concurrency", "debugging", "async", "oop"]

[scoring]
test_file = "solution.test.js"
reference_solution = "reference.js"

[scoring.weight_override]
test_pass_rate = 0.60
lint_score = 0.25
complexity_score = 0.15
