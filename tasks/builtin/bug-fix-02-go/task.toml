name = "bug-fix-02-go"
task_type = "bug-fix"
difficulty = "medium"
size = "function"
language = "go"
description = "Fix stability and indexing bugs in merge sort implementation"
starter_code = "starter.go"
expected_files = ["solution.go"]

prompt = """
The file `starter.go` contains a `MergeSort(arr []int) []int` function with multiple bugs.

The function should:
- Return a new sorted slice (not modify the original)
- Be stable (preserve relative order of equal elements)
- Work correctly for all inputs (empty, single element, duplicates, etc.)

Find and fix all bugs. Save your corrected solution as `solution.go` in package `solution`.
"""

tags = ["algorithms", "debugging", "sorting", "stability"]

[scoring]
test_file = "solution_test.go"
reference_solution = "reference.go"

[scoring.weight_override]
test_pass_rate = 0.60
lint_score = 0.25
complexity_score = 0.15
