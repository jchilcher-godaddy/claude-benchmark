name = "bug-fix-01-js"
task_type = "bug-fix"
difficulty = "easy"
size = "function"
language = "javascript"
description = "Fix off-by-one error in binary search implementation"
starter_code = "starter.js"

prompt = """
The file `starter.js` contains a `binarySearch(arr, target)` function with a bug.

The function should:
- Return the index of target in the sorted array arr
- Return -1 if target is not found
- Work correctly for all edge cases (empty array, single element, first/last element, etc.)

Find and fix the bug. Save your corrected solution as `solution.js`.
"""

tags = ["algorithms", "debugging", "search"]

[scoring]
test_file = "solution.test.js"
reference_solution = "reference.js"

[scoring.weight_override]
test_pass_rate = 0.60
lint_score = 0.25
complexity_score = 0.15
