name = "bug-fix-04-go"
task_type = "bug-fix"
difficulty = "medium"
size = "module"
language = "go"
description = "Fix SQL injection vulnerabilities and logic bugs in a query builder"
starter_code = "starter.go"
expected_files = ["solution.go"]

prompt = """
The file `starter.go` contains a `QueryBuilder` struct for constructing SQL SELECT queries.
It has several security vulnerabilities and logic bugs:

1. SQL injection via string interpolation in where clauses
2. Missing column-name validation in OrderBy() allowing injection
3. No table/column name whitelist validation
4. Multiple Where() calls overwrite previous conditions instead of AND-chaining

Fix all issues. The QueryBuilder should:
- Use parameterized queries: Build() returns (sql string, params []interface{}, error)
- Validate table and column names against a whitelist passed to NewQueryBuilder
- Chain multiple Where() calls with AND
- Return error for invalid table/column names or empty queries

Save your corrected solution as `solution.go` in package `solution`.
"""

tags = ["security", "sql", "debugging", "input-validation"]

[scoring]
test_file = "solution_test.go"
reference_solution = "reference.go"

[scoring.weight_override]
test_pass_rate = 0.60
lint_score = 0.25
complexity_score = 0.15
