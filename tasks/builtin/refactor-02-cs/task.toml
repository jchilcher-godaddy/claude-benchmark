name = "refactor-02-cs"
task_type = "refactor"
difficulty = "medium"
size = "function"
language = "csharp"
description = "Replace nested conditionals with early returns"

prompt = """
Refactor `Starter.cs` to use early returns and guard clauses instead of deeply nested conditionals.

The code currently has 5-6 levels of nested if/else statements that are correct but hard to read.
Refactor to use a flat structure with early returns for error cases.

Requirements:
- Method signature and return values must remain identical
- All tests must pass
- Use guard clauses and early returns
- Maximum nesting depth of 2 levels
"""

starter_code = "Starter.cs"
expected_files = ["Solution.cs"]
tags = ["refactoring", "conditionals", "readability"]

[scoring]
test_file = "SolutionTests.cs"
reference_solution = "Reference.cs"

[scoring.weight_override]
test_pass_rate = 0.35
lint_score = 0.25
complexity_score = 0.40
