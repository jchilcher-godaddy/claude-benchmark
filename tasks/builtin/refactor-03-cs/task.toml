name = "refactor-03-cs"
task_type = "refactor"
difficulty = "hard"
size = "module"
language = "csharp"
description = "Convert procedural code to classes"

prompt = """
Refactor `Starter.cs` into a class-based design with separation of concerns.

The code currently processes CSV-like data procedurally with methods that share state
through long argument chains. The logic mixes parsing, validation, transformation, and formatting.

Requirements:
- Maintain the `DataProcessor.ProcessData(string rawInput)` top-level API
- All tests must pass
- Create classes with clear separation of concerns (parsing, validation, transformation, formatting)
- Eliminate long argument chains by using instance attributes
"""

starter_code = "Starter.cs"
expected_files = ["Solution.cs"]
tags = ["refactoring", "oop", "separation-of-concerns", "design"]

[scoring]
test_file = "SolutionTests.cs"
reference_solution = "Reference.cs"

[scoring.weight_override]
test_pass_rate = 0.35
lint_score = 0.25
complexity_score = 0.40
