name = "refactor-03-go"
task_type = "refactor"
difficulty = "hard"
size = "module"
language = "go"
description = "Convert procedural code to structs with methods"
starter_code = "starter.go"
expected_files = ["solution.go"]

prompt = """Refactor `starter.go` into a struct-based design with separation of concerns.

The code currently processes CSV-like data procedurally with functions that share state
through long argument chains. The logic mixes parsing, validation, transformation, and formatting.

Requirements:
- Maintain the `ProcessData(rawInput string) string` top-level API
- All tests must pass
- Create structs with methods for clear separation of concerns (parsing, validation, transformation, formatting)
- Eliminate long argument chains by using struct fields

Save your refactored solution as `solution.go` in package `solution`.
"""

tags = ["refactoring", "oop", "separation-of-concerns", "design"]

[scoring]
test_file = "solution_test.go"
reference_solution = "reference.go"

[scoring.weight_override]
test_pass_rate = 0.35
lint_score = 0.25
complexity_score = 0.40
