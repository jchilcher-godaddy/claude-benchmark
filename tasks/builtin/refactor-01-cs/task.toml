name = "refactor-01-cs"
task_type = "refactor"
difficulty = "easy"
size = "function"
language = "csharp"
description = "Extract repeated logic into helper methods"

prompt = """
Refactor `Starter.cs` to eliminate duplication by extracting helper methods.

The code currently has significant duplication in processing different record fields.
Extract the repeated patterns into reusable helper methods.

Requirements:
- External API must not change (ProcessRecords method signature stays the same)
- All tests must pass
- Eliminate duplicated filter/transform/aggregate logic
"""

starter_code = "Starter.cs"
expected_files = ["Solution.cs"]
tags = ["refactoring", "duplication", "functions"]

[scoring]
test_file = "SolutionTests.cs"
reference_solution = "Reference.cs"

[scoring.weight_override]
test_pass_rate = 0.35
lint_score = 0.25
complexity_score = 0.40
