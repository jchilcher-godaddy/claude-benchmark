name = "bug-fix-01-cs"
task_type = "bug-fix"
difficulty = "easy"
size = "function"
language = "csharp"
description = "Fix off-by-one error in binary search implementation"
starter_code = "Starter.cs"

prompt = """
The file `Starter.cs` contains a `BinarySearch.Search(int[] arr, int target)` method with a bug.

The method should:
- Return the index of target in the sorted array arr
- Return -1 if target is not found
- Work correctly for all edge cases (empty array, single element, first/last element, etc.)

Find and fix the bug. Save your corrected solution as `Solution.cs`.
"""

tags = ["algorithms", "debugging", "search"]

[scoring]
test_file = "SolutionTests.cs"
reference_solution = "Reference.cs"

[scoring.weight_override]
test_pass_rate = 0.60
lint_score = 0.25
complexity_score = 0.15
