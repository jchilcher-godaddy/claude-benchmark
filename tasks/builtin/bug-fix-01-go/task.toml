name = "bug-fix-01-go"
task_type = "bug-fix"
difficulty = "easy"
size = "function"
language = "go"
description = "Fix off-by-one error in binary search implementation"
starter_code = "starter.go"
expected_files = ["solution.go"]

prompt = """
The file `starter.go` contains a `BinarySearch(arr []int, target int) int` function with a bug.

The function should:
- Return the index of target in the sorted slice arr
- Return -1 if target is not found
- Work correctly for all edge cases (empty slice, single element, first/last element, etc.)

Find and fix the bug. Save your corrected solution as `solution.go` in package `solution`.
"""

tags = ["algorithms", "debugging", "search"]

[scoring]
test_file = "solution_test.go"
reference_solution = "reference.go"

[scoring.weight_override]
test_pass_rate = 0.60
lint_score = 0.25
complexity_score = 0.15
